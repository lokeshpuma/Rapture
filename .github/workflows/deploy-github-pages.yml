name: Deploy mobile to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Clerk publishable key
        id: clerk
        env:
          SECRET_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          VAR_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          ALT_SECRET: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          KEY=""
          for candidate in "$SECRET_KEY" "$VAR_KEY" "$ALT_SECRET"; do
            if [ -n "$candidate" ]; then
              KEY="$candidate"
              break
            fi
          done
          if [ -z "$KEY" ] && [ -f clerk.publishable.key ]; then
            KEY="$(tr -d '[:space:]' < clerk.publishable.key)"
          fi
          if [ -n "$KEY" ]; then
            case "$KEY" in
              pk_test_*|pk_live_*) ;;
              *)
                echo "::warning::Clerk key should start with pk_test_ or pk_live_; building anyway"
                ;;
            esac
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "key=$KEY" >> "$GITHUB_OUTPUT"
            echo "Clerk publishable key resolved for build."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Clerk key found. The site will deploy with a setup message instead of login."
            echo "Add ONE of:"
            echo "  - Actions secret: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY"
            echo "  - Repository variable: EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY"
            echo "  - File in repo: mobile/clerk.publishable.key (copy from clerk.publishable.key.example)"
          fi

      - name: Export static web app
        run: npm run build:web
        env:
          EXPO_BASE_URL: /Rapture
          EXPO_PUBLIC_BASE_PATH: /Rapture
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ steps.clerk.outputs.key }}
          EXPO_PUBLIC_API_URL: https://rapture-olive.vercel.app/api

      - name: Add GitHub Pages helpers
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
