name: Deploy mobile to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Clerk publishable key
        env:
          CLERK_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$CLERK_KEY" ]; then
            echo "::error::Add repository secret EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY (Clerk Dashboard → API Keys → Publishable key)"
            exit 1
          fi
          case "$CLERK_KEY" in
            pk_test_*|pk_live_*) ;;
            *) echo "::error::EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY must start with pk_test_ or pk_live_"; exit 1 ;;
          esac

      - name: Export static web app
        run: npm run build:web
        env:
          EXPO_BASE_URL: /Rapture
          EXPO_PUBLIC_BASE_PATH: /Rapture
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_URL: https://rapture-olive.vercel.app/api

      - name: Add GitHub Pages helpers
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
